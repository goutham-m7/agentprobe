name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=agentprobe --cov-report=term-missing --cov-fail-under=90
      - run: uv run agentprobe demo --out .agentprobe/ci-demo --seed 42 --samples 10000
      - name: Exercise the no-regression gate
        run: uv run agentprobe diff .agentprobe/ci-demo/good .agentprobe/ci-demo/good --fail-on-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentprobe-demo-evidence
          path: .agentprobe/ci-demo
