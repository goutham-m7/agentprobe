[project]
name = "agentprobe"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Goutham Madineni", email = "151193576+goutham-m7@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
agentprobe = "agentprobe:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
]
